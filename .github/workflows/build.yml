name: build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # `build` runs `test` and `runGameTest` as part of the check task, so this covers both.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v5
        with:
          name: chestloader-jar
          path: build/libs/*.jar
          if-no-files-found: error
